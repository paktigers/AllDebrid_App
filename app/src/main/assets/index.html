<title>AllDebrid</title>
<style>
:root{--bg:#0b1020;--card:rgba(255,255,255,.055);--bd:rgba(255,255,255,.09);--tx:#e8ecff;--mut:#97a0c3;--ac:#6366f1;--ac2:#22d3ee;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--r:16px;
--hdr:#16204a;--nav:rgba(14,19,40,.96);--act:#0e1328;--sheet:#141b38;--toastbg:#1d2650;--field:rgba(0,0,0,.28);--chip:rgba(255,255,255,.07);--btn:rgba(255,255,255,.08);--track:rgba(255,255,255,.08);--pill:rgba(255,255,255,.1);--scrim:rgba(0,0,0,.6);--load:rgba(5,8,20,.75);--on:rgba(99,102,241,.12);--shadow:none;--hero:linear-gradient(90deg,#fff,#22d3ee);color-scheme:dark}
:root[data-theme=light]{--bg:#f3f5fb;--card:#fff;--bd:rgba(20,30,70,.12);--tx:#141a33;--mut:#5a6385;--ac:#5559e8;--ac2:#0ea5c6;--ok:#047857;--bad:#e11d48;--warn:#b45309;
--hdr:#e4e9fc;--nav:rgba(255,255,255,.97);--act:#fff;--sheet:#fff;--toastbg:#fff;--field:#eceff9;--chip:rgba(20,30,70,.06);--btn:rgba(20,30,70,.07);--track:rgba(20,30,70,.1);--pill:rgba(20,30,70,.08);--scrim:rgba(10,15,40,.45);--load:rgba(243,245,251,.82);--on:rgba(85,89,232,.1);--shadow:0 1px 3px rgba(20,30,70,.08);--hero:linear-gradient(90deg,#141a33,#5559e8);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(180deg,var(--hdr),var(--bg));border-bottom:1px solid var(--bd)}
.logo{width:40px;height:40px;object-fit:contain;display:block;flex:none}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
header h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
#themeBtn{padding:4px 8px;font-size:20px}
#keyBadge{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:12px}
main{flex:1;overflow-y:auto;padding:12px 14px 96px;-webkit-overflow-scrolling:touch}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
h3,h4{margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
textarea,input[type=text],input[type=password],input:not([type]){width:100%;background:var(--field);border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:12px;font:inherit;outline:none;margin-bottom:10px}
textarea{min-height:130px;resize:vertical}
textarea:focus,input:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.row.scroll{flex-wrap:wrap}
.row.scroll::-webkit-scrollbar{display:none}
.chip{background:var(--chip);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.btn{flex:1;background:var(--btn);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:13px;font-size:15px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.btn.danger{background:rgba(251,113,133,.15);border-color:rgba(251,113,133,.4);color:var(--bad)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
.ib{background:none;border:0;color:var(--tx);font-size:22px;padding:4px 10px}
.sw{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;margin:2px 0 12px}
.sw input{width:18px;height:18px;margin:0;accent-color:var(--ac)}
.counts{font-size:13px;color:var(--mut);margin:-4px 0 10px}
.prog .ph{display:flex;justify-content:space-between;margin-bottom:8px}
.bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.plog{max-height:180px;overflow-y:auto;font-size:12.5px;margin-top:6px}
.pl{padding:2px 0;word-break:break-all;color:var(--mut)}.pl.ok{color:var(--ok)}.pl.bad{color:var(--bad)}.pl.warn{color:var(--warn)}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--bd);background:var(--card);box-shadow:var(--shadow);border-radius:14px;margin-bottom:8px}
.item .ck{flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--mut);margin-top:2px}
.item.on{border-color:var(--ac);background:var(--on)}
.item.on .ck{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;position:relative}
.item.on .ck:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.im{min-width:0;flex:1}.t{font-weight:600;word-break:break-word}.s{font-size:12.5px;color:var(--mut);word-break:break-word}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pill);margin-left:6px}
.pill.ok{background:rgba(52,211,153,.18);color:var(--ok)}.pill.bad{background:rgba(251,113,133,.18);color:var(--bad)}.pill.warn{background:rgba(251,191,36,.18);color:var(--warn)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.menu{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--bd);background:var(--card);border-radius:14px;margin-bottom:8px;width:100%;color:var(--tx);font-size:15px;text-align:left}
.menu b{display:block}.menu span{font-size:12.5px;color:var(--mut)}.menu .ic{font-size:22px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac2)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.overlay.show{transform:none}
.ov-head{display:flex;align-items:center;gap:6px;padding:10px 8px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,var(--hdr),var(--bg))}
.ov-head b{font-size:17px}.sp{flex:1}
.ov-body{flex:1;overflow-y:auto;padding:12px 14px 40px}
.actbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);background:var(--act);overflow-x:auto}
.actbar .chip{flex:none}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
.sbg{position:absolute;inset:0;background:var(--scrim)}
.sbody{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:22px 22px 0 0;padding:18px 16px 22px;max-height:85%;overflow-y:auto;border-top:1px solid var(--bd)}
.chooselist{max-height:46vh;overflow-y:auto;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--toastbg);color:var(--tx);box-shadow:0 6px 20px rgba(0,0,0,.25);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:var(--bad);color:var(--bad)}
#loading{position:fixed;inset:0;background:var(--load);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#loading.show{display:flex}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--track);border-top-color:var(--ac2);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.krow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.dli .row{margin:6px 0 0}.dli.done .t{color:var(--ok)}.dli.failed .t{color:var(--bad)}
.hero{padding:6px 4px 14px}.hero h2{margin:0 0 4px;font-size:22px;background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent}

nav button.dot:after{content:"";position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--bad)}
.item{flex-wrap:wrap}
.item.open{border-color:var(--ac2);background:var(--on)}
.imenu{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mbtn{background:var(--chip);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:13px}
.mbtn.danger{color:var(--bad);border-color:rgba(251,113,133,.45)}
.item .im{flex:1 1 0}
button,.chip,.btn,.item,.mbtn{touch-action:manipulation}
.chip{min-height:38px;display:inline-flex;align-items:center}
.vchart{display:flex;align-items:flex-end;gap:4px;height:120px;margin:10px 0 4px}
.vchart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.vchart i{display:block;width:100%;min-height:2px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--ac2),var(--ac))}
.vchart span{font-size:10px;color:var(--mut);margin-top:3px}
.qrow{margin-bottom:12px}.qrow .qh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.bar i.hot{background:linear-gradient(90deg,var(--warn),var(--bad))}
#lockScreen{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lockScreen.show{display:flex}
#lkDots{display:flex;gap:12px;height:18px}
#lkDots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
#lkDots i.on{background:var(--ac2);border-color:var(--ac2)}
#lkPad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
#lkPad button{height:60px;border-radius:50%;background:var(--chip);border:1px solid var(--bd);color:var(--tx);font-size:22px}
#lkDev{max-width:320px;width:100%;flex:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="AllDebrid">
  <h1>AllDebrid<small>Premium link generator</small></h1>
  <button id="themeBtn" class="ib" title="Theme">🌙</button>
  <button id="keyBadge">🔑 —</button>
</header>

<main>
  <!-- ===== GENERATE ===== -->
  <section class="tab on" id="t-gen">
    <div class="hero"><h2>Generate links</h2><div class="mut">Paste hoster links and magnets in one place. The app detects them automatically.</div></div>
    <div class="card">
      <textarea id="inp" placeholder="https://... (hoster links)&#10;magnet:?xt=... (torrents)&#10;One link per line"></textarea>
      <div class="counts" id="counts"></div>
      <div class="row scroll">
        <button class="chip" id="bPaste">📋 Paste</button>
        <button class="chip" id="bFile">📄 .txt file</button>
        <button class="chip" id="bTor">🧲 .torrent file</button>
        <button class="chip" id="bClear">✕ Clear</button>
      </div>
      <input id="pw" type="text" placeholder="Password (only for protected links)">
      <label class="sw"><input type="checkbox" id="pick"> Let me choose which torrent files to get</label>
      <div class="row"><button class="btn primary" id="bGen">⚡ Generate</button><button class="btn" id="bChk">🔍 Check</button></div>
    </div>
    <div id="genLog"></div>
    <input type="file" id="fTxt" accept=".txt,text/plain" hidden>
    <input type="file" id="fTor" accept=".torrent,application/x-bittorrent" multiple hidden>
  </section>

  <!-- ===== TORRENTS ===== -->
  <section class="tab" id="t-tor">
    <div class="hero"><h2>My torrents</h2><div class="mut" id="tHint">Tap a torrent to see its actions.</div></div>
    <div class="row scroll" id="tFilt">
      <button class="chip on" data-f="">All</button><button class="chip" data-f="ready">Ready</button>
      <button class="chip" data-f="active">Active</button><button class="chip" data-f="error">Error</button>
      <button class="chip" id="tRef">↻ Refresh</button><button class="chip" id="tSel">☑ Select multiple</button>
    </div>
    <div class="row scroll" id="tBulk" style="display:none">
      <button class="chip on" data-b="dl">⬇ Download all files</button><button class="chip" data-b="res">↺ Restart</button>
      <button class="chip" data-b="del">🗑 Delete</button><button class="chip" data-b="all">Select all</button>
    </div>
    <div id="tList"></div>
  </section>

  <!-- ===== HISTORY ===== -->
  <section class="tab" id="t-his">
    <div class="hero"><h2>History</h2><div class="mut">Generated links are saved here.</div></div>
    <div class="row scroll"><button class="chip on" data-h="link">Hoster links</button><button class="chip" data-h="magnet">Torrents</button></div>
    <input id="hQ" type="text" placeholder="Search (name, host, torrent)">
    <div class="row scroll">
      <button class="chip" id="hSel">☑ Select multiple</button><button class="chip" id="hCsv">📊 CSV</button><button class="chip" id="hClr">Clear all</button>
    </div>
    <div class="row scroll" id="hBulk" style="display:none">
      <button class="chip on" data-b="dl">⬇ Download</button><button class="chip" data-b="play">▶ Play</button>
      <button class="chip" data-b="copy">📋 Direct links</button><button class="chip" data-b="orig">📋 Original</button>
      <button class="chip" data-b="share">📤 Share</button><button class="chip" data-b="rm">🗑 Remove</button><button class="chip" data-b="all">Select all</button>
    </div>
    <div class="mut" id="hCount" style="margin-bottom:8px"></div>
    <div id="hList"></div>
  </section>

  <!-- ===== DOWNLOADS ===== -->
  <section class="tab" id="t-dl">
    <div class="hero"><h2>Downloads</h2><div class="mut" id="dlStat"></div></div>
    <div class="row"><button class="btn" id="dlOpen">📂 Downloads folder</button><button class="btn" id="dlClr">Clear finished</button></div>
    <div id="dlList"></div>
  </section>

  <!-- ===== MORE ===== -->
  <section class="tab" id="t-more">
    <div class="hero"><h2>More</h2></div>
    <button class="menu" data-m="account"><span class="ic">👤</span><div><b>Account / API keys</b><span>Keys, PIN login, account info</span></div></button>
    <button class="menu" data-m="hosts"><span class="ic">🌐</span><div><b>Hosts &amp; Quota</b><span>Supported hosts, search, limits</span></div></button>
    <button class="menu" data-m="server"><span class="ic">🕘</span><div><b>AllDebrid server history</b><span>Your account's own links history</span></div></button>
    <button class="menu" data-m="usage"><span class="ic">📊</span><div><b>Usage &amp; quota</b><span>Premium days, host quotas, 14-day graph</span></div></button>
    <button class="menu" data-m="settings"><span class="ic">⚙️</span><div><b>Settings</b><span>Parallel downloads, folders</span></div></button>
    <button class="menu" data-m="help"><span class="ic">📘</span><div><b>Help / Guide</b><span>How to use the app</span></div></button>
  </section>
</main>

<nav>
  <button data-t="gen" class="on"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Generate</button>
  <button data-t="tor"><svg viewBox="0 0 24 24"><path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Torrents</button>
  <button data-t="his"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History</button>
  <button data-t="dl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>Downloads</button>
  <button data-t="more"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>More</button>
</nav>

<div id="lockScreen"><img src="logo.png" alt="" style="width:88px;height:88px"><h2 style="margin:0">AllDebrid is locked</h2><div class="mut" id="lkMsg"></div><div id="lkDots"></div><div id="lkPad"></div><button class="btn" id="lkDev">Unlock with phone lock</button></div>

<div id="toast"></div>
<div id="loading"><div class="spin"></div><div id="loadTxt" class="mut">Please wait…</div></div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtSize = b => { b = +b || 0; if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB'; if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB'; return Math.max(0, Math.round(b / 1024)) + ' KB'; };
const fmtEpoch = t => (+t > 0 ? new Date(+t * 1000).toLocaleString() : '-');
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const hostOf = u => { try { return new URL(u).host; } catch (e) { return ''; } };
const short = (s, n = 70) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const safe = s => (String(s).replace(/[\\/:*?"<>|]/g, '_').replace(/^\.+/, '_').trim().slice(0, 120) || '_');
const uniq = a => [...new Set(a)];

let toastT;
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, 3400); }
function loading(msg) { $('#loadTxt').textContent = msg || 'Please wait…'; $('#loading').classList.add('show'); }
function loadingSet(msg) { $('#loadTxt').textContent = msg; }
function loaded() { $('#loading').classList.remove('show'); }

/* ================= native bridge ================= */
const API = 'https://api.alldebrid.com';
const _cbs = {}; let _n = 0;
window.__cb = (id, res) => { const f = _cbs[id]; if (f) { delete _cbs[id]; f(JSON.parse(res)); } };
function http(method, url, headers, body) {
  return new Promise((res, rej) => {
    if (window.Android) {
      const id = 'r' + (++_n);
      _cbs[id] = r => (r.error ? rej(new Error('Network error: ' + r.error)) : res(r));
      Android.request(id, method, url, JSON.stringify(headers || {}), body || '');
    } else {
      fetch(url, { method, headers, body: method === 'POST' ? body : undefined })
        .then(async r => res({ status: r.status, body: await r.text() }))
        .catch(e => rej(new Error('Network error: ' + e.message)));
    }
  });
}
function copyText(t) { if (window.Android) Android.copy(t); else if (navigator.clipboard) navigator.clipboard.writeText(t); toast('Copied'); }
function pasteText() { if (window.Android) return Promise.resolve(Android.paste()); return navigator.clipboard ? navigator.clipboard.readText() : Promise.resolve(''); }
function shareText(t, title) { if (window.Android) Android.share(t, title || 'AllDebrid'); else copyText(t); }
function openUrl(u) { if (window.Android) Android.openUrl(u); else window.open(u, '_blank'); }

/* ================= errors ================= */
const HINTS = {
  LINK_HOST_NOT_SUPPORTED: 'This host is NOT supported by AllDebrid', LINK_NOT_SUPPORTED: 'This link is not supported',
  LINK_DOWN: 'The link is dead / the file was deleted', LINK_PASS_PROTECTED: 'The link is password-protected',
  LINK_HOST_UNAVAILABLE: 'The host is unavailable right now, try again later', LINK_TEMPORARY_UNAVAILABLE: 'The link is temporarily unavailable',
  LINK_HOST_FULL: 'The host has no free slots, try again later', LINK_HOST_LIMIT_REACHED: 'The limit for this host has been reached',
  LINK_TOO_MANY_DOWNLOADS: 'Too many downloads on this link', LINK_IS_MISSING: 'The link is missing or invalid',
  LINK_ERROR: 'There is a problem with this link', MUST_BE_PREMIUM: 'A premium account is required', FREE_TRIAL_LIMIT_REACHED: 'Free trial limit reached',
  NO_SERVER: 'VPN / server IP is not allowed', AUTH_BAD_APIKEY: 'The API key is invalid', AUTH_MISSING_APIKEY: 'The API key is not set',

  const headers = { Authorization: 'Bearer ' + key };

  let r;

    await sleep(120);
    r = await http(method, `${API}/${ver}/${endpoint}`, headers, b);
    if (r.status !== 429 && r.status !== 503) break;
    await sleep(1500);

  let j;

  if (j.status !== 'success') throw new ADError((j.error && j.error.code) || 'ERROR', (j.error && j.error.message) || 'Unknown error');
  return j.data;
}

async function unlock(link, pw) {

async function unlockMany(links, pw) {
  const P = progCard('Hoster links unlock'); const ok = [], fail = [], known = [];

  for (const l of links) {
    i++; P.pct(i - 1, links.length); P.line('⏳ ' + short(l), '', l);
    let r = null, err = null;

    if (!r && err && err.code === 'LINK_PASS_PROTECTED') {
      for (const k of known) { try { r = await unlock(l, k); err = null; break; } catch (e) { err = e; } }
      if (!r) { const p = await ask('Password for this link', { placeholder: short(l, 40), ok: 'Try' }); if (p) { try { r = await unlock(l, p); known.push(p); err = null; } catch (e) { err = e; } } }
    }
    if (r) { r.type = 'link'; ok.push(r); P.line('✔ ' + r.filename + ' (' + fmtSize(r.size) + ')', 'ok', l); }
    else { const code = (err && err.code) || ''; fail.push({ link: l, host: hostOf(l), code, text: err ? err.message : '' }); P.line('✖ [' + (code || 'ERR') + '] ' + (hint(code) || (err && err.message) || ''), 'bad', l); }

async function magnetUpload(ms) { const d = await ad('magnet/upload', { 'magnets[]': ms }); return d.magnets || []; }

  const key = getKey(); if (!key) throw new ADError('AUTH_MISSING_APIKEY', 'API key is not set');
  if (!window.Android) throw new Error('.torrent upload works only in the Android app');
  const r = await new Promise(res => { const id = 'u' + (++_n); _cbs[id] = res; Android.upload(id, API + '/v4/magnet/upload/file', JSON.stringify({ Authorization: 'Bearer ' + key }), JSON.stringify(files.map(f => ({ name: f.name, b64: f.b64 })))); });
  if (r.error) throw new Error('Network error: ' + r.error);

}

  const out = [];
  for (const n of nodes || []) { if (n.e) out.push(...leafFiles(n.e, path ? path + '/' + n.n : n.n)); else if (n.l) out.push({ n: n.n, s: n.s, l: n.l, path: path || '' }); }

}
async function waitMagnets(list, P, cancel) {
  const ready = list.filter(x => x.ready); let pending = list.filter(x => !x.ready);
  while (pending.length && !cancel.stop) {
    const still = [];
    for (const p of pending) {
      let s;
      try { s = await magnetStatus(p.id); }
      catch (e) { P.line('✖ ' + p.name + ': ' + errText(e), 'bad', 'm' + p.id); if (e.code !== 'MAGNET_INVALID_ID') still.push(p); continue; }
      if (!s) continue;
      const pct = s.size > 0 && s.downloaded ? Math.round(100 * s.downloaded / s.size) : 0;
      const sp = s.downloadSpeed ? ' · ' + fmtSize(s.downloadSpeed) + '/s' : '';
      const se = s.seeders !== undefined ? ' · ' + s.seeders + ' seeders' : '';
      P.line(`${p.name} — ${s.status} ${pct}%${sp}${se}`, s.statusCode >= 5 ? 'bad' : '', 'm' + p.id);
      if (s.statusCode === 4) ready.push(p); else if (s.statusCode < 5) still.push(p);

    pending = still;
    P.pct(ready.length, list.length);
    if (!pending.length) break;
    for (let t = 0; t < 6 && !cancel.stop; t++) await sleep(1000);

}
async function magnetItems(id, name, pick, P) {
  const d = await ad('magnet/files', { 'id[]': id });
  const m0 = (d.magnets || [])[0];
  if (!m0) return [];
  if (m0.error) throw new ADError(m0.error.code, m0.error.message);
  let files = leafFiles(m0.files, '');
  if (pick && files.length > 1) {
    loaded();
    const idx = await choose('Files: ' + name, files.map(f => ({ label: (f.path ? f.path + '/' : '') + f.n, sub: fmtSize(f.s) })));
    if (!idx || !idx.length) return [];
    files = idx.map(i => files[i]);

  const items = []; let i = 0;
  for (const f of files) {
    i++; P.pct(i, files.length);
    try { const r = await unlock(f.l); Object.assign(r, { type: 'magnet', magnet: name, folder: name, subPath: f.path, magnetId: String(id) }); items.push(r); P.line('✔ ' + r.filename, 'ok', 'f' + id + '_' + i); }

async function magnetFlow(magnets, torrents) {
  const P = progCard('Torrents / Magnets'); const list = [];
  const note = m => { if (m.error) P.line('✖ ' + short(String(m.magnet || m.file || ''), 50) + ' — [' + m.error.code + '] ' + (hint(m.error.code) || m.error.message), 'bad'); else { P.line('＋ ' + m.name, 'ok'); list.push({ id: m.id, name: m.name, ready: !!m.ready }); } };
  if (magnets.length) (await magnetUpload(magnets)).forEach(note);
  if (torrents.length) (await uploadTorrents(torrents)).forEach(note);
  if (!list.length) { P.done(); return []; }
  if (list.some(x => !x.ready)) P.line('AllDebrid first downloads the torrent on its own servers; links appear when it is ready (cached torrents are instant). You can tap Stop waiting at any time: the torrent keeps downloading on the server and you will find it in the Torrents tab.', 'warn');
  const cancel = { stop: false }; P.onStop(() => { cancel.stop = true; });
  const ready = await waitMagnets(list, P, cancel);
  const pick = $('#pick').checked, items = [];

  const rem = list.filter(x => !ready.includes(x));
  if (cancel.stop && rem.length) {

    toast('Torrent keeps downloading on the server. Tap it in the Torrents tab when it is Ready.');

}

/* ================= smart list: tap an item to open its action menu ================= */
function SmartList(box, opts) {
  const st = { rows: [], exp: null, sel: new Set(), selMode: false };
  const keyOf = r => String(opts.key(r));
  function draw() {
    box.innerHTML = st.rows.map((r, i) => {
      const k = keyOf(r), open = !st.selMode && st.exp === k, on = st.selMode && st.sel.has(k);
      const menu = open ? '<div class="imenu">' + opts.menu(r).map((m, j) => `<button class="mbtn ${m.cls || ''}" data-m="${j}">${m.label}</button>`).join('') + '</div>' : '';
      return `<div class="item ${open ? 'open' : ''} ${on ? 'on' : ''}" data-k="${esc(k)}">${st.selMode ? '<span class="ck"></span>' : ''}<div class="im">${opts.render(r, i)}${menu}</div></div>`;
    }).join('') || `<div class="empty">${esc((typeof opts.empty === 'function' ? opts.empty() : opts.empty) || 'Nothing found')}</div>`;
  }
  box.onclick = e => {
    const it = e.target.closest('.item'); if (!it) return;
    const k = it.dataset.k, row = st.rows.find(r => keyOf(r) === k);
    const mb = e.target.closest('[data-m]');
    if (mb && row) { const m = opts.menu(row)[+mb.dataset.m]; if (m) m.run(row); return; }
    if (st.selMode) { if (st.sel.has(k)) st.sel.delete(k); else st.sel.add(k); draw(); if (opts.onSelect) opts.onSelect(); }
    else { st.exp = st.exp === k ? null : k; draw(); const el = box.querySelector('.item.open'); if (el) el.scrollIntoView({ block: 'nearest' }); }
  };
  return {
    st,
    setRows(rows) { const sig = JSON.stringify(rows); if (sig === st.sig && st.drawn) return; st.sig = sig; st.drawn = true; st.rows = rows; if (st.exp !== null && !rows.some(r => keyOf(r) === st.exp)) st.exp = null; const keep = new Set(rows.map(keyOf)); [...st.sel].forEach(k => { if (!keep.has(k)) st.sel.delete(k); }); draw(); },
    setSelectMode(b) { st.selMode = b; st.sel.clear(); st.exp = null; draw(); },
    selectAll() { st.rows.forEach(r => st.sel.add(keyOf(r))); draw(); },
    selected() { return st.rows.filter(r => st.sel.has(keyOf(r))); },
    draw
  };
}

const isFresh = it => !!(it.link && it.t && Date.now() - it.t < 600000);
async function fresh(it) {
  if (isFresh(it) || !it.source) return it;
  const r = await unlock(it.source);
  return Object.assign({}, it, { link: r.link, t: r.t, gid: r.gid, streams: r.streams, size: it.size || r.size });
}
async function freshAll(list) {
  const need = list.filter(x => !isFresh(x) && x.source).length; const out = [];

}
async function streamItems(list, start) {
  if (!getKey()) { toast('Please add an API key first', true); return; }

}

let dl = store.get('ad_dl', []);
let dlSeq = Date.now();
const subdirOf = d => (cfg.folderPerTorrent && d.folder ? [safe(d.folder)].concat(String(d.subPath || '').split('/').filter(Boolean).map(safe)).join('/') : '');
function enqueueDownloads(items) {
  for (const it of items) dl.push({ uid: ++dlSeq, name: it.filename, link: it.link || '', source: it.source || '', folder: it.folder || it.magnet || '', subPath: it.subPath || '', magnetId: it.magnetId || '', size: it.size || 0, t: it.link ? (it.t || Date.now()) : 0, state: 'queued', dmId: null, done: 0, total: it.size || 0, err: '' });
  store.set('ad_dl', dl); toast(items.length + ' file(s) added to the download queue'); pump();
}
async function startItem(d) {
  try {
    if ((!d.link || Date.now() - d.t > 15 * 60 * 1000) && d.source) { const r = await unlock(d.source); d.link = r.link; d.t = Date.now(); if (!d.size) d.size = r.size; }
    if (!d.link) throw new Error('Link not found');
    if (!window.Android) { window.open(d.link, '_blank'); d.state = 'done'; return; }
    const id = Android.download(d.link, safe(d.name), subdirOf(d));
    if (id < 0) throw new Error('Could not start the download (check storage permission)');
    d.dmId = id; d.state = 'running'; d.lastT = 0; d.speed = 0;
  } catch (e) { d.state = 'failed'; d.err = errText(e); }
}
async function onDone(d) {
  toast('✔ ' + d.name);
  if (!cfg.autoDeleteMagnet || !d.magnetId || d.mdel) return;
  const grp = dl.filter(x => x.magnetId === d.magnetId);
  if (grp.every(x => x.state === 'done')) { grp.forEach(x => { x.mdel = true; }); try { await ad('magnet/delete', { id: d.magnetId }); toast('Torrent deleted from the server'); } catch (e) {} }
}
let pumping = false;
async function pump() {
  if (pumping) return; pumping = true;
  try {
    const running = dl.filter(d => d.state === 'running');
    if (running.length && window.Android) {
      let st = []; try { st = JSON.parse(Android.downloadStatus(JSON.stringify(running.map(d => d.dmId)))); } catch (e) {}
      const map = {}; st.forEach(s => { map[s.id] = s; });
      const now = Date.now();
      for (const d of running) {
        const s = map[d.dmId];
        if (!s) { d.state = 'cancelled'; continue; }
        if (d.lastT) d.speed = Math.max(0, (s.done - d.lastDone) / ((now - d.lastT) / 1000));
        d.lastT = now; d.lastDone = s.done; d.done = s.done; if (s.total > 0) d.total = s.total;
        if (s.status === 8) { d.state = 'done'; d.speed = 0; onDone(d); }
        else if (s.status === 16) { d.state = 'failed'; d.speed = 0; d.err = 'Download failed (code ' + s.reason + ')'; }
        else d.sub = s.status === 4 ? 'paused' : '';
      }
    }
    let active = dl.filter(d => d.state === 'running').length;
    for (const d of dl) { if (active >= cfg.parallel) break; if (d.state !== 'queued') continue; await startItem(d); if (d.state === 'running') active++; }
    store.set('ad_dl', dl);
    if (curTab === 'dl') renderDL();
  } finally { pumping = false; }
}
setInterval(() => { if (dl.some(d => d.state === 'running' || d.state === 'queued')) pump(); }, 2000);

function renderDL() {
  const box = $('#dlList');
  const c = s => dl.filter(d => d.state === s).length;
  $('#dlStat').textContent = `Running: ${c('running')} · Queued: ${c('queued')} · Done: ${c('done')} · Failed: ${c('failed')}`;
  const names = { queued: 'Queued', running: 'Downloading', done: 'Completed', failed: 'Failed', cancelled: 'Cancelled' };
  box.innerHTML = dl.slice().reverse().map(d => {
    const pct = d.state === 'done' ? 100 : (d.total > 0 ? Math.min(100, Math.round(100 * d.done / d.total)) : 0);
    const acts = (d.state === 'running' || d.state === 'queued' ? '<button class="chip" data-a="cancel">✕ Cancel</button>' : '') + (d.state === 'failed' || d.state === 'cancelled' ? '<button class="chip" data-a="retry">↻ Retry</button>' : '') + (d.state !== 'running' && d.state !== 'queued' ? '<button class="chip" data-a="remove">🗑</button>' : '');
    return `<div class="card dli ${d.state}" data-u="${d.uid}"><div class="t">${esc(d.name)}</div><div class="s">${names[d.state]}${d.state === 'running' || d.state === 'done' ? ' · ' + fmtSize(d.done) + ' / ' + fmtSize(d.total) : ''}${d.speed ? ' · ' + fmtSize(d.speed) + '/s' : ''}${d.sub === 'paused' ? ' · paused' : ''}${d.err ? ' · ' + esc(d.err) : ''}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="row">${acts}</div></div>`;
  }).join('') || '<div class="empty">No downloads yet</div>';
}

async function pinLogin() {
  const r = await http('GET', API + '/v4.1/pin/get', {}, ''); const j = JSON.parse(r.body);
  if (j.status !== 'success') throw new ADError(j.error.code, j.error.message);

  const b = openSheet(`<h3>PIN: ${esc(p.pin)}</h3><div class="mut" style="margin-bottom:10px">A page will open in the browser; enter the PIN there. It will be detected here automatically.</div><div class="row"><button class="btn" id="pnNo">Cancel</button><button class="btn primary" id="pnOpen">Open browser</button></div><div class="mut" id="pnSt">Waiting…</div>`);

  while (!cancelled && Date.now() < end) {
    await sleep(5000); if (cancelled) break;
    const c = await http('POST', API + '/v4/pin/check', { 'Content-Type': 'application/x-www-form-urlencoded' }, form({ pin: p.pin, check: p.check }));

const appInfo = (() => { try { return window.Android && Android.appInfo ? JSON.parse(Android.appInfo()) : null; } catch (e) { return null; } })();
async function checkUpdate(manual) {
  if (!appInfo || !appInfo.repo) { if (manual) toast('Updates work only for APKs built on GitHub', true); return; }
  try {
    const r = await http('GET', `https://api.github.com/repos/${appInfo.repo}/releases/latest`, { Accept: 'application/vnd.github+json' }, '');
    if (r.status === 404) throw new Error('No release found yet. The repository must be public and a signed build must have finished.');
    if (r.status !== 200) throw new Error('GitHub returned HTTP ' + r.status);
    const j = JSON.parse(r.body);
    const code = parseInt(String(j.tag_name || '').replace(/\D/g, ''), 10) || 0;
    const asset = (j.assets || []).find(a => /\.apk$/i.test(a.name));
    store.set('ad_lastcheck', Date.now());
    if (code > appInfo.versionCode && asset) { if (manual || store.get('ad_skipver', 0) !== code) offerUpdate(j, code, asset); }
    else if (manual) toast(code > appInfo.versionCode ? 'An update exists but no APK is attached' : 'You have the latest version ✔');
  } catch (e) { if (manual) toast(errText(e), true); }
}
function offerUpdate(rel, code, asset) {
  if ($('#sheet').classList.contains('show') || locked) { setTimeout(() => offerUpdate(rel, code, asset), 6000); return; }
  const notes = String(rel.body || '').slice(0, 400);
  const b = openSheet(`<h3>Update available</h3><div class="mut" style="margin-bottom:12px">New build ${code} (you have ${appInfo.versionCode}). ${asset.size ? fmtSize(asset.size) : ''}${notes ? '<br><br>' + esc(notes) : ''}</div><div class="row"><button class="btn" id="upSkip">Skip this version</button><button class="btn" id="upLater">Later</button></div><div class="row"><button class="btn primary" id="upGo">⬇ Download &amp; install</button></div>`);
  $('#upLater', b).onclick = cancelSheet;
  $('#upSkip', b).onclick = () => { store.set('ad_skipver', code); cancelSheet(); };
  $('#upGo', b).onclick = () => { closeSheet(); if (window.Android && Android.installUpdate) Android.installUpdate(asset.browser_download_url); else window.open(asset.browser_download_url, '_blank'); };
}
if (appInfo && cfg.autoUpdate !== false && Date.now() - store.get('ad_lastcheck', 0) > 6 * 3600 * 1000) setTimeout(() => checkUpdate(false), 4000);

/* ================= sha256 (pure JS, works without secure context) ================= */
function sha256(str) {
  const rr = (n, x) => (x >>> n) | (x << (32 - n));
  const K = [], H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  let p = 2; for (let n = 0; n < 64; p++) { let ok = true; for (let d = 2; d * d <= p; d++) if (p % d === 0) { ok = false; break; } if (ok) { K[n++] = Math.floor((Math.cbrt(p) % 1) * 4294967296) | 0; } }
  const bytes = unescape(encodeURIComponent(str)).split('').map(c => c.charCodeAt(0));
  const bl = bytes.length * 8; bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bl >>> (i * 8)) & 255);
  for (let o = 0; o < bytes.length; o += 64) {
    const w = []; for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const s0 = rr(7, w[i - 15]) ^ rr(18, w[i - 15]) ^ (w[i - 15] >>> 3), s1 = rr(17, w[i - 2]) ^ rr(19, w[i - 2]) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) { const t1 = (h + (rr(6, e) ^ rr(11, e) ^ rr(25, e)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((rr(2, a) ^ rr(13, a) ^ rr(22, a)) + ((a & b) ^ (a & c) ^ (b & c))) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0; }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
}

/* ================= app lock ================= */
let pinBuf = '', pinAttempts = 0;
const deviceSecure = () => { try { return !!(window.Android && Android.isDeviceSecure && Android.isDeviceSecure()); } catch (e) { return false; } };
function setSecure() { try { if (window.Android && Android.setSecure) Android.setSecure(!!lockCfg); } catch (e) {} }
function drawDots() { const n = Math.max(4, pinBuf.length); $('#lkDots').innerHTML = Array.from({ length: Math.min(8, n) }, (_, i) => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join(''); }
function showLock() {
  if (!lockCfg) return;
  locked = true; pinBuf = ''; closeSheet();
  const L = $('#lockScreen'); L.classList.add('show');
  const pin = lockCfg.mode === 'pin';
  $('#lkMsg').textContent = pin ? 'Enter your PIN' : 'Use your phone lock to continue';
  $('#lkDots').style.display = pin ? 'flex' : 'none'; $('#lkPad').style.display = pin ? 'grid' : 'none';
  $('#lkDev').style.display = (!pin || deviceSecure()) ? 'block' : 'none';
  if (pin) { drawDots(); $('#lkPad').innerHTML = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].map(k => `<button data-k="${k}">${k}</button>`).join(''); }
  if (!pin) setTimeout(deviceUnlock, 250);
}
function unlockOk() {
  locked = false; pinAttempts = 0; $('#lockScreen').classList.remove('show');
  if (pendingTorrent) { const t = pendingTorrent; pendingTorrent = null; window.__incomingTorrent(t.name, t.b64); }
  setTimeout(checkClipboard, 600);
}
function deviceUnlock() { if (window.Android && Android.authenticate) Android.authenticate(); else unlockOk(); }
window.__authResult = ok => { if (authCb) { const cb = authCb; authCb = null; cb(ok); return; } if (ok) unlockOk(); else $('#lkMsg').textContent = 'Not unlocked. Try again.'; };
let authCb = null;
const pinOk = pin => lockCfg && lockCfg.mode === 'pin' && sha256(lockCfg.salt + pin) === lockCfg.hash;
$('#lkPad').onclick = e => {
  const b = e.target.closest('[data-k]'); if (!b || !locked || locked === 'wait') return; const k = b.dataset.k;
  if (k === '⌫') pinBuf = pinBuf.slice(0, -1);
  else if (k === 'OK') {
    if (pinOk(pinBuf)) { unlockOk(); return; }
    pinAttempts++; pinBuf = ''; drawDots(); $('#lkDots').classList.remove('shake'); void $('#lkDots').offsetWidth; $('#lkDots').classList.add('shake');
    $('#lkMsg').textContent = pinAttempts >= 5 ? 'Too many attempts. Wait 10 seconds.' : 'Wrong PIN'; if (pinAttempts >= 5) { locked = 'wait'; setTimeout(() => { locked = true; pinAttempts = 0; $('#lkMsg').textContent = 'Enter your PIN'; }, 10000); }
    return;
  } else if (pinBuf.length < 8) pinBuf += k;
  drawDots();
};
$('#lkDev').onclick = deviceUnlock;
// ask the user to prove it is them (used before turning the lock off / changing it)
function verifyUser() {
  return new Promise(res => {
    if (!lockCfg) return res(true);
    if (lockCfg.mode === 'device') { authCb = res; deviceUnlock(); }
    else ask('Enter your current PIN', { type: 'password', ok: 'Confirm' }).then(v => res(v !== null && pinOk(v)));
  });
}
async function setNewPin() {
  const a = await ask('Choose a PIN (4 to 8 digits)', { type: 'password', ok: 'Next' }); if (a === null) return null;
  if (!/^\d{4,8}$/.test(a)) { toast('The PIN must be 4 to 8 digits', true); return null; }
  const b = await ask('Repeat the PIN', { type: 'password', ok: 'Save' }); if (b === null) return null;
  if (a !== b) { toast('The PINs do not match', true); return null; }
  const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
  return { mode: 'pin', salt, hash: sha256(salt + a) };
}
async function enableLock(done) {
  if (lockCfg && !(await verifyUser())) { toast('Not confirmed', true); return; }
  const dev = deviceSecure();
  const choice = await new Promise(res => {
    const b = openSheet(`<h3>App lock method</h3><div class="mut" style="margin-bottom:12px">${dev ? 'Phone lock uses your fingerprint, face, PIN or pattern.' : 'Your phone has no screen lock, so only an app PIN is possible.'}</div>${dev ? '<div class="row"><button class="btn primary" id="lkPhone">Use phone lock</button></div>' : ''}<div class="row"><button class="btn" id="lkPin">Use an app PIN</button></div><div class="row"><button class="btn" id="lkNo">Cancel</button></div>`);
    sheetCancel = () => res(null);
    if (dev) $('#lkPhone', b).onclick = () => { closeSheet(); res('device'); };
    $('#lkPin', b).onclick = () => { closeSheet(); res('pin'); };
    $('#lkNo', b).onclick = cancelSheet;
  });
  if (!choice) return;
  if (choice === 'pin') { const c = await setNewPin(); if (!c) return; lockCfg = c; }
  else { const ok = await new Promise(r => { authCb = r; deviceUnlock(); }); if (!ok) { toast('Phone lock was not confirmed', true); return; } lockCfg = { mode: 'device' }; }
  store.set('ad_lock', lockCfg); setSecure(); toast('App lock is on'); if (done) done();
}
async function disableLock(done) {
  if (!(await verifyUser())) { toast('Not confirmed', true); return; }
  lockCfg = null; store.set('ad_lock', null); setSecure(); toast('App lock is off'); if (done) done();
}
window.__bg = () => { hiddenAt = Date.now(); };
window.__fg = () => {
  if (lockCfg && !locked && hiddenAt && Date.now() - hiddenAt > 30000 && !skipLockOnce) showLock();
  skipLockOnce = false; hiddenAt = 0;
};

/* ================= clipboard detect ================= */
const clipHash = t => t.length + ':' + t.slice(0, 40) + ':' + t.slice(-40);
async function checkClipboard() {
  if (!window.Android || cfg.clipDetect === false || locked) return;
  if ($('#sheet').classList.contains('show') || $('#loading').classList.contains('show') || ovStack.length) return;
  let t = ''; try { t = String(Android.paste() || ''); } catch (e) { return; }
  if (!t || t.length > 200000) return;
  const sp = splitInput(parseLines(t)), n = sp.links.length + sp.magnets.length;
  if (!n) return;
  const h = clipHash(t); if (store.get('ad_lastclip', '') === h) return;
  store.set('ad_lastclip', h);
  const first = parseLines(t)[0] || '';
  const b = openSheet(`<h3>Links found in your clipboard</h3><div class="mut" style="margin-bottom:12px">${sp.links.length} hoster link(s), ${sp.magnets.length} magnet(s).<br><span style="word-break:break-all">${esc(short(first, 80))}</span></div><div class="row"><button class="btn" id="cbNo">Ignore</button><button class="btn" id="cbAdd">Add to the box</button></div><div class="row"><button class="btn primary" id="cbGo">⚡ Generate now</button></div>`);
  const fill = () => { const i = $('#inp'); i.value = (i.value ? i.value.trimEnd() + '\n' : '') + t.trim(); updateCounts(); go('gen'); };
  $('#cbNo', b).onclick = cancelSheet;
  $('#cbAdd', b).onclick = () => { closeSheet(); fill(); };
  $('#cbGo', b).onclick = () => { closeSheet(); fill(); generate(); };
}
window.__focus = () => setTimeout(checkClipboard, 500);

/* ================= .torrent file opened from outside the app ================= */
window.__incomingTorrent = (name, b64) => {
  if (locked) { pendingTorrent = { name, b64 }; return; }
  torrentFiles.push({ name, b64 }); updateCounts(); go('gen');
  confirmBox('Torrent file received: ' + name, 'Generate now', 'Later').then(y => { if (y) generate(); });
};

/* ================= usage & quota graphs ================= */
async function showUsage() {
  const ov = openOverlay('Usage & quota', '<div class="empty">Loading…</div>');
  const B = $('.ov-body', ov);
  try {
    if (!getKey()) throw new ADError('AUTH_MISSING_APIKEY', 'API key is not set');
    const u = (await ad('user', {}, { method: 'GET' })).user || {};
    let hosts = {};
    try { hosts = (await ad('user/hosts', {}, { ver: 'v4.1', method: 'GET' })).hosts || {}; } catch (e) {}
    const left = u.premiumUntil ? Math.max(0, Math.ceil((u.premiumUntil * 1000 - Date.now()) / 86400000)) : 0;
    const premPct = Math.max(2, Math.min(100, left / 30 * 100));
    let html = `<div class="card"><h4>Premium</h4><div class="qh" style="display:flex;justify-content:space-between"><span>${u.isPremium ? '<b>' + left + ' day(s) left</b>' : 'Not premium'}</span><span class="mut">${fmtEpoch(u.premiumUntil)}</span></div><div class="bar"><i class="${left <= 3 ? 'hot' : ''}" style="width:${premPct}%"></i></div><div class="mut">Fidelity points: ${esc(u.fidelityPoints ?? '-')}</div></div>`;
    const rows = Object.values(hosts).filter(h => 'quota' in h);
    html += '<div class="card"><h4>Host quotas (what is left)</h4>' + (rows.length ? rows.map(h => {
      const tr = h.quotaType === 'traffic', max = +h.quotaMax || 0, leftQ = +h.quota || 0;
      const used = max > 0 ? Math.max(0, Math.min(100, (max - leftQ) / max * 100)) : 0;
      const fmt = v => tr ? fmtSize(v * 1048576) : v + ' downloads';
      return `<div class="qrow"><div class="qh"><b>${esc(h.name)}</b><span class="mut">${fmt(leftQ)} left${max ? ' of ' + fmt(max) : ''}</span></div><div class="bar"><i class="${used > 85 ? 'hot' : ''}" style="width:${used}%"></i></div></div>`;
    }).join('') : '<div class="mut">No limited hosts on your account.</div>') + '</div>';
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ key: d.toDateString(), label: d.getDate(), size: 0, n: 0 }); }
    hist.forEach(e => { const k = new Date(e.date).toDateString(), d = days.find(x => x.key === k); if (d) { d.size += +e.size || 0; d.n++; } });
    const max = Math.max(1, ...days.map(d => d.size)), tot = days.reduce((a, d) => a + d.size, 0), cnt = days.reduce((a, d) => a + d.n, 0);
    html += `<div class="card"><h4>Links generated: last 14 days</h4><div class="mut">${cnt} link(s), ${fmtSize(tot)} in total. AllDebrid does not publish a traffic history, so this graph comes from the links you generated in this app.</div><div class="vchart">${days.map(d => `<div class="col" title="${esc(d.label)}: ${fmtSize(d.size)}"><i style="height:${Math.round(100 * d.size / max)}%"></i><span>${d.label}</span></div>`).join('')}</div></div>`;
    B.innerHTML = html;
  } catch (e) { B.innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; }
}

/* ================= init ================= */
applyTheme(); updateBadge(); updateCounts(); renderDL(); pump();
if (lockCfg) { showLock(); setSecure(); }
setTimeout(checkClipboard, 2500);
if (!getKey()) setTimeout(() => toast('Add an API key to get started (tap 🔑)'), 600);
</script>
